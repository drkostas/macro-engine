name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: macroengine
          POSTGRES_PASSWORD: macroengine
          POSTGRES_DB: macroengine
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U macroengine"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: ./web
    env:
      DATABASE_URL: postgresql://macroengine:macroengine@localhost:5432/macroengine
      BASE_URL: http://localhost:3457
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Apply schema and seed
        run: |
          PGPASSWORD=macroengine psql -h localhost -U macroengine -d macroengine -f db/schema.sql
          PGPASSWORD=macroengine psql -h localhost -U macroengine -d macroengine -f db/seed.sql
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - run: npm run e2e -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
