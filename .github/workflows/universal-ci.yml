name: universal-ci

on:
  pull_request:
    paths:
      - "universal/**"
      - ".github/workflows/universal-ci.yml"
  push:
    branches: [main]
    paths:
      - "universal/**"

jobs:
  test:
    name: Universal — Typecheck + Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: universal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        # The committed flat config (macro-engine#259, M5); zero warnings is the gate.
        run: npm run lint -- --max-warnings 0
      - name: Unit tests
        run: npm test
