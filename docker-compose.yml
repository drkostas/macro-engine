services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: macroengine
      POSTGRES_PASSWORD: macroengine
      POSTGRES_DB: macroengine
    volumes:
      - macroengine_db:/var/lib/postgresql/data
      - ./web/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./web/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U macroengine"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://macroengine:macroengine@postgres:5432/macroengine
    ports:
      - "127.0.0.1:3457:3457"

volumes:
  macroengine_db:
