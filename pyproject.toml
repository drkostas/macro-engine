[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "macro-engine"
version = "0.1.0"
description = "Nutrition TDEE, macro targets, and meal planning engine"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "Kostas Georgiou", email = "drkostas@gmail.com"}]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
