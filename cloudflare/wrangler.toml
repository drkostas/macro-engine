name = "macro-engine-garmin-auth"
main = "worker.ts"
compatibility_date = "2026-04-01"

# Uncomment the KV namespace below if you want the /login + /login-mfa
# credential-based flow (requires MFA session storage). The ticket-based
# /exchange flow works without KV.
#
# To create the namespace:
#   wrangler kv namespace create MFA_SESSIONS
# Then paste the returned id below.
#
# [[kv_namespaces]]
# binding = "MFA_SESSIONS"
# id = "<your-kv-namespace-id>"
